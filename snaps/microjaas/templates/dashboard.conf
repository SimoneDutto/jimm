daemon off;
user root;
worker_processes 1;
pid dashboard.pid;
error_log stderr;

events {
    worker_connections 128;
}

http {
    include /snap/microjaas/current/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path dashboard-body;
    proxy_temp_path dashboard-proxy;
    fastcgi_temp_path dashboard-fastcgi;
    uwsgi_temp_path dashboard-uwsgi;
    scgi_temp_path dashboard-scgi;

    server {
        listen 18600 ssl;
        server_name microjaas.test;
        ssl_certificate /var/snap/microjaas/common/config/tls.crt;
        ssl_certificate_key /var/snap/microjaas/common/config/tls.key;
        root /snap/microjaas/current/share/dashboard;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location = /config.js {
            add_header Cache-Control "no-store";
        }
    }
}
